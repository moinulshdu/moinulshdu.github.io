title: "Md Moinul Islam"
tagline: "Semiconductor nanocrystals · surface chemistry · scientific software"
description: >-
  Md Moinul Islam is a Ph.D. chemist at the University of South Carolina
  specializing in the synthesis, surface engineering and characterization of
  atomically precise semiconductor (CdSe) nanocrystals, ligand-exchange
  thermodynamics (ITC, NMR), automated instrumentation and MATLAB/Python data
  analysis, with GLP/cGMP pharmaceutical industry experience.
url: "https://moinulshdu.github.io"
baseurl: ""
lang: en

author:
  name: "Md Moinul Islam"
  job_title: "Ph.D. Candidate in Chemistry"
  affiliation: "University of South Carolina"
  affiliation_url: "https://sc.edu/study/colleges_schools/chemistry_and_biochemistry/"
  location: "Columbia, SC, USA"
  photo: "/images/profile-moinul.png"
  email: "mdmoinul@email.sc.edu"
  email_personal: "moinulshdu@gmail.com"
  linkedin: "https://www.linkedin.com/in/moinulshdu"
  scholar: "https://scholar.google.com/citations?user=5mSvSY0AAAAJ&hl=en"
  github: "moinulshdu"
  orcid: ""            # e.g. "https://orcid.org/0000-0000-0000-0000"

# Put your CV PDF in the "files" folder with exactly this name.
# The "Download CV" buttons appear automatically once the file is there.
cv_pdf: "/files/Md_Moinul_Islam_CV.pdf"

# Private area (Firebase). See HOW-TO-UPDATE.md, part 6.
private_area: true

# Paste the verification code from Google Search Console here (optional).
google_site_verification: ""

# ----------------------------------------------------------------------------
#  Collections — you normally don't need to change anything below.
# ----------------------------------------------------------------------------
collections:
  apps:
    output: true
    permalink: /apps/:name/
  courses:
    output: true
    permalink: /learn/courses/:name/
  projects:
    output: true
    permalink: /fun-projects/:name/

permalink: /learn/articles/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
timezone: America/New_York
future: false

defaults:
  - scope: { path: "", type: posts }
    values: { layout: article }
  - scope: { path: "", type: apps }
    values: { layout: app }
  - scope: { path: "", type: courses }
    values: { layout: course }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - HOW-TO-UPDATE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - firestore.rules
  - templates/
  - vendor/
  - .bundle/
