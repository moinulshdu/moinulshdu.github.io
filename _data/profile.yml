headline: >-
  I make and study atomically precise semiconductor nanocrystals — and build the
  instruments and software that make the measurements faster and more reliable.

summary: >-
  Ph.D. candidate in Chemistry at the University of South Carolina (advisor:
  Prof. Andrew B. Greytak). My research resolves site-specific thermodynamics of
  ligand binding on CdSe "magic-sized" nanocrystal surfaces using isothermal
  titration calorimetry (ITC) and NMR — the molecular-level chemistry behind
  surface passivation, interface control and selectivity in nanomaterial and
  thin-film processes. I designed an automated gel-permeation chromatography
  (GPC) platform with in-line UV–Vis monitoring, write MATLAB and Python tools
  for global data analysis, and bring 14 months of GLP/cGMP analytical
  development experience from the pharmaceutical industry.

open_to: >-
  Open to industry and postdoctoral roles in semiconductor process and module
  development, materials characterization, nanomaterials, and
  photo(electro)chemistry of semiconductor surfaces and interfaces.

