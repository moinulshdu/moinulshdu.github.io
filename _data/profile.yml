research:
  - title: "Ligand-exchange thermodynamics"
    text: "Stoichiometry and regioselectivity of ligand exchange on atomically precise CdSe nanocrystals, resolved site by site with ITC and NMR."
  - title: "Automated purification & in-situ monitoring"
    text: "In-house automated GPC with an in-line UV–Vis flow cell for millisecond-resolved absorption, spectral deconvolution of mixtures and reproducible purification."
  - title: "Quantitative data analysis"
    text: "MATLAB tools for global ITC fitting across conditions and spectral fitting (e.g., dual pKa from pH-dependent absorption), used across the group."
  - title: "Collaborative surface chemistry"
    text: "Thermodynamic analysis for lead-halide perovskite and magnetic iron-oxide nanocrystals, boronic esters and photoactive macrocycles."

skills:
  - group: "Materials & process development"
    items: "Colloidal nanocrystal synthesis (CdSe, metal oxides), surface modification and ligand exchange, phase transfer, GPC purification, air-free (vacuum / inert-atmosphere) handling, multi-condition experiment design"
  - group: "Characterization"
    items: "STEM, PXRD, FTIR, NMR, UV–Vis and fluorescence, time-resolved PL, ITC, TGA, DSC, BET, MALDI, HPLC, GC, optical microscopy"
  - group: "Data analysis & software"
    items: "MATLAB (custom fitting, global analysis, spectral deconvolution), Python, Igor Pro, Origin, ImageJ, NanoAnalyze, TopSpin, Maple, VESTA, ChemDraw, LaTeX"
  - group: "Instrumentation & hardware"
    items: "Design, automation and troubleshooting of custom instruments (automated GPC with in-line flow-cell spectroscopy), Arduino, Onshape and AutoCAD"
  - group: "Quality, safety & compliance"
    items: "GLP/cGMP documentation, deviation investigation and corrective actions, internal audits, SOP writing and training, nanomaterial and toxic-compound handling"

