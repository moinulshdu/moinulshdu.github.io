<a class="app-tile" href="{{ app.url | relative_url }}">
  <img class="app-icon" src="{{ app.icon | relative_url }}" alt="{{ app.title }} icon" width="120" height="120" loading="lazy">
  <span class="app-name">{{ app.title }}</span>
  {% if app.status == "released" %}<span class="dl" data-repo="{{ app.repo }}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="dl-n">–</span></span>{% else %}<span class="dl soon">Coming soon</span>{% endif %}
</a>
