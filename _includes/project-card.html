<a class="card project-card" href="{{ project.url | relative_url }}">
  <span class="project-thumb">{% if project.thumbnail and project.thumbnail != "" %}<img src="{{ project.thumbnail | relative_url }}" alt="" loading="lazy">{% else %}<span class="fig-ph">{{ project.title | slice: 0 }}</span>{% endif %}
    {% if project.sim %}<span class="badge-play">▶ Playable</span>{% endif %}</span>
  <span class="card-body">
    <span class="meta">{{ project.tags | join: " · " }}</span>
    <span class="course-title">{{ project.title }}</span>
    <span class="course-sum">{{ project.summary | strip_html | truncatewords: 32 }}</span>
  </span>
</a>
