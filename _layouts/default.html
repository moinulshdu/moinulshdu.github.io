<!doctype html>
<html lang="{{ site.lang }}">
<head>
{% include head.html %}
</head>
<body class="layout-{{ page.layout }}">
<a class="skip" href="#main">Skip to content</a>
{% include header.html %}
{% if page.draft %}<div class="draft-banner">DRAFT — not published. This page is hidden from menus, lists and search engines. To publish it, change <code>draft: true</code> to <code>draft: false</code>.</div>{% endif %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
